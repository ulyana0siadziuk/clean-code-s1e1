<!DOCTYPE html>
<html>
<head>
  <title>Todo App</title>
  <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
  <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
</head>
<body class="body">

  <header class="header">
    <img class="header__image" src="./eisenhower-matrix.jpg" alt="Eisenhower Matrix">
    <a class="header__link" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
  </header>

  <main class="container">
    <section id="add-task">
      <label for="new-task" class="add-task__label">Add Item</label>
      <div class="task__row">
        <input id="new-task"class="task add-task__input input_type_text" type="text">
        <button class="button">Add</button>
      </div>

    </section>
    <section class="section">
      <h2 class="section__title">Todo</h2>

      <ul id="incomplete" class="task-list">

        <li class="task-list__item">
          <input type="checkbox" class="task-list__checkbox">
          <label class="task task-list__label">Pay Bills</label>
          <input type="text" class="task task-list__input input_type_text">
          <button class="button button_edit">Edit</button>
          <button class="button button_delete">
            <img src="./remove.svg" alt="Delete task">
          </button>
        </li>

        <li class="task-list__item task-list__item_edit-mode">
          <input type="checkbox" class="task-list__checkbox">
          <label class="task task-list__label">Go Shopping</label>
          <input type="text" value="Go Shopping" class="task task-list__input input_type_text">
          <button class="button button_edit">Save</button>
          <button class="button button_delete">
            <img src="./remove.svg" alt="Delete task">
          </button>
        </li>

      </ul>
    </section>
    <section class="section">
      <h2 class="section__title">Completed</h2>
      <ul id="completed" class="task-list task-list_completed">
        <li class="task-list__item">
          <input type="checkbox" class="task-list__checkbox" checked>
          <label class="task task-list__label">See the Doctor</label>
          <input type="text" class="task task-list__input input_type_text">
          <button class="button button_edit">Edit</button>
          <button class="button button_delete">
            <img src="./remove.svg" alt="Delete task">
          </button>

        </li>
      </ul>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
